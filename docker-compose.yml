services:
  mongo:
    image: mongo:6
    container_name: carprice-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carprice-backend
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=carprice
      - ANALYTICS_EXPORT_KEY=dev-key
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_BASE_URL=http://localhost:8000
    container_name: carprice-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo_data:
